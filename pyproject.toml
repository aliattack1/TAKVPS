[project]
name = "takvps"
version = "1.4.5"
description = "Client-only SSH / VPS manager"
requires-python = ">=3.10"
dependencies = [
  "flet>=0.80",
  "asyncssh>=2.14",
  "httpx>=0.27",
  "cryptography",
]

[tool.flet]
org = "dev.takvps"
product = "takvps"

[tool.flet.android]
# min_sdk_version = 24 is what Flutter 3.47+ actually requires on the
# GitHub Actions runner (Android 7.0 Nougat, Aug 2016). The previous
# bump to 23 was based on Flutter's documented "minimum supported
# version", but the ReleaseMinSdkCheck task on the runner enforces 24.
# Bumped from 23 → 24 in v1.3.4.
# See: https://developer.android.com/about/dashboards
min_sdk_version = 24
target_sdk_version = 34
