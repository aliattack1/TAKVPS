[project]
name = "takvps"
version = "1.1.1"
description = "Client-only SSH / VPS manager"
requires-python = ">=3.10"
dependencies = [
  "flet>=0.80",
  "asyncssh>=2.14",
  "httpx>=0.27",
  "cryptography",
]

[tool.flet]
org = "dev.takvps"
product = "takvps"

[tool.flet.android]
min_sdk_version = 21
target_sdk_version = 34
