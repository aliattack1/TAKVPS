[project]
name = "takvps"
version = "1.3.0"
description = "Client-only SSH / VPS manager"
requires-python = ">=3.10"
dependencies = [
  "flet>=0.80",
  "asyncssh>=2.14",
  "httpx>=0.27",
  "cryptography",
]

[tool.flet]
org = "dev.takvps"
product = "takvps"

[tool.flet.android]
# min_sdk_version = 23 is the minimum Flutter 3.47+ accepts (Android 6.0
# Marshmallow, Oct 2015). Devices below this are <0.5% of the install base
# in 2026 per Google's distribution dashboard — not worth carrying the
# build-brokenness to support. Bumped from 21 in v1.3.0 after the Flutter
# toolchain started enforcing ReleaseMinSdkCheck.
# See: https://developer.android.com/about/dashboards
min_sdk_version = 23
target_sdk_version = 34
