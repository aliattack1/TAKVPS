# Runs pytest on every push and PR.
# This catches pure-logic regressions early (the UI isn't tested here — see README).
name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest is already in requirements.txt; ensure it's there.
          pip install pytest

      - name: Syntax-check every Python file
        run: |
          # Catch any syntax errors before pytest (which only imports test files).
          find . -name "*.py" -not -path "./build/*" -not -path "./.github/*" \
            -exec python -m py_compile {} \;

      - name: Run pytest
        run: |
          # Use the project root as the test root so relative imports work.
          python -m pytest tests/ -v --tb=short
