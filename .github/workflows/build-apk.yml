name: Build Android APK (Signed)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $HOME/takvps.keystore

      - name: Pre-fetch serious_python
        run: flet build apk --verbose --yes || true

      - name: Patch serious_python mobilePyPiUrl
        run: |
          set -e
          file=$(find "$HOME/.pub-cache" -path "*serious_python-*/bin/package_command.dart" | head -1)
          sed -i 's|const mobilePyPiUrl = "https://pypi.flet.dev";|const mobilePyPiUrl = "https://pypi.flet.dev/";|' "$file"

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flet build apk --verbose --yes \
            --keystore "$HOME/takvps.keystore" \
            --keystore-password "$KEYSTORE_PASSWORD" \
            --keystore-key-alias takvps \
            --keystore-key-password "$KEY_PASSWORD"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: takvps-release-apk
          path: build/flutter/build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Debug — show build tree (on failure)
        if: failure()
        run: |
          find build -maxdepth 6 -type d 2>/dev/null | head -40 || true
          find . -name "*.apk" 2>/dev/null || true
