name: Build Android APK (Signed)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $HOME/takvps.keystore
          ls -lh $HOME/takvps.keystore

      - name: Pre-fetch serious_python
        run: flet build apk --verbose --yes || true

      - name: Patch serious_python mobilePyPiUrl
        run: |
          set -e
          file=$(find "$HOME/.pub-cache" -path "*serious_python-*/bin/package_command.dart" | head -1)
          if [ -z "$file" ]; then
            echo "ERROR: serious_python source not found in pub cache"
            exit 1
          fi
          sed -i 's|const mobilePyPiUrl = "https://pypi.flet.dev";|const mobilePyPiUrl = "https://pypi.flet.dev/";|' "$file"

      - name: Build APK (unsigned)
        run: flet build apk --verbose --yes

      - name: Sign APK with release key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Find the built APK
          APK=$(find build -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            find build -name "*.apk" 2>/dev/null
            exit 1
          fi
          echo "Found APK: $APK"

          # Get apksigner from build-tools
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          APKSIGNER="${BUILD_TOOLS_DIR}apksigner"

          echo "Signing with release keystore..."
          "$APKSIGNER" sign \
            --ks "$HOME/takvps.keystore" \
            --ks-key-alias takvps \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            "$APK"

          echo "Verifying signature..."
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: takvps-release-apk
          path: |
            build/flutter/build/app/outputs/apk/release/*.apk
            build/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Debug — show build tree (on failure)
        if: failure()
        run: |
          echo "=== build/ dirs ==="
          find build -maxdepth 6 -type d 2>/dev/null | head -40 || true
          echo "=== all .apk files ==="
          find . -name "*.apk" 2>/dev/null || true
