name: Build Android APK (Signed)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $HOME/takvps.keystore
          ls -lh $HOME/takvps.keystore

      - name: Pre-fetch serious_python
        run: flet build apk --verbose --yes || true

      - name: Patch serious_python mobilePyPiUrl
        run: |
          set -e
          file=$(find "$HOME/.pub-cache" -path "*serious_python-*/bin/package_command.dart" | head -1)
          if [ -z "$file" ]; then
            echo "ERROR: serious_python source not found in pub cache"
            exit 1
          fi
          sed -i 's|const mobilePyPiUrl = "https://pypi.flet.dev";|const mobilePyPiUrl = "https://pypi.flet.dev/";|' "$file"
          grep -n mobilePyPiUrl "$file"

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          flet build apk --verbose --yes \
            --android-signing-key-store "$HOME/takvps.keystore" \
            --android-signing-key-store-password "$KEYSTORE_PASSWORD" \
            --android-signing-key-alias "$KEY_ALIAS" \
            --android-signing-key-password "$KEY_PASSWORD" \
            --flutter-build-args=--android-skip-build-dependency-validation
        # `--flutter-build-args=--android-skip-build-dependency-validation`
        # is the *proper* flet-supported way to bypass Flutter's Gradle
        # ReleaseMinSdkCheck (and friends). flet-cli's `--flutter-build-args`
        # passes everything after it through to the underlying
        # `flutter build apk` command, where the actual flag lives.
        #
        # The earlier attempt used `--android-skip-build-dependency-validation`
        # as a top-level flet CLI flag, which doesn't exist in flet-cli 1.1.2
        # and was rejected by argparse with exit code 2. This corrected form
        # is documented in `flet build apk --help`:
        #   "Additional arguments for flutter build command. Attach an
        #    argument that starts with `-` using `=`, e.g.
        #    `--flutter-build-args=--obfuscate`".
        #
        # Combined with min_sdk_version = 23 in pyproject.toml (the actual
        # fix for the original ReleaseMinSdkCheck failure), this should
        # keep the build green through any future Flutter/AGP constraint
        # tightenings (e.g. AGP 8.13 → 9.0.1).

      - name: Verify APK signature
        run: |
          APK=$(find build -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "APK: $APK"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          "${BUILD_TOOLS}apksigner" verify --print-certs "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: takvps-release-apk
          path: |
            build/flutter/build/app/outputs/apk/release/*.apk
            build/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Debug — capture build diagnostics (on failure)
        if: failure()
        run: |
          echo "========== build/flutter/android/app/build.gradle =========="
          # This file is what flet generates from pyproject.toml. If
          # min_sdk_version = 23 wasn't picked up, the build.gradle will
          # still show minSdkVersion 21 (and ReleaseMinSdkCheck fails).
          cat build/flutter/android/app/build.gradle 2>/dev/null | head -80 || \
            echo "(build.gradle not found — flet didn't generate the Android shell)"
          echo ""
          echo "========== build/flutter/android/settings.gradle =========="
          # The AGP version that's actually in use lives here.
          cat build/flutter/android/settings.gradle 2>/dev/null | head -40 || true
          echo ""
          echo "========== build/flutter/android/gradle.properties =========="
          cat build/flutter/android/gradle.properties 2>/dev/null | head -40 || true
          echo ""
          echo "========== build tree (directories) =========="
          find build -maxdepth 6 -type d 2>/dev/null | head -40 || true
          echo ""
          echo "========== any APK produced? =========="
          find . -name "*.apk" 2>/dev/null || true
          echo ""
          echo "========== last 200 lines of flet verbose log =========="
          # flet writes a verbose log somewhere under build/ — find it.
          log=$(find build -name "*.log" -type f 2>/dev/null | head -1)
          if [ -n "$log" ]; then
            tail -200 "$log"
          else
            echo "(no .log file found under build/)"
          fi
