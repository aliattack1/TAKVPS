name: Build Android APK (Signed)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $HOME/takvps.keystore
          ls -lh $HOME/takvps.keystore

      - name: Pre-fetch serious_python
        run: flet build apk --verbose --yes || true

      - name: Patch serious_python mobilePyPiUrl
        run: |
          set -e
          file=$(find "$HOME/.pub-cache" -path "*serious_python-*/bin/package_command.dart" | head -1)
          if [ -z "$file" ]; then
            echo "ERROR: serious_python source not found in pub cache"
            exit 1
          fi
          sed -i 's|const mobilePyPiUrl = "https://pypi.flet.dev";|const mobilePyPiUrl = "https://pypi.flet.dev/";|' "$file"
          grep -n mobilePyPiUrl "$file"

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          flet build apk --verbose --yes \
            --android-signing-key-store "$HOME/takvps.keystore" \
            --android-signing-key-store-password "$KEYSTORE_PASSWORD" \
            --android-signing-key-alias "$KEY_ALIAS" \
            --android-signing-key-password "$KEY_PASSWORD"
        # Note: the `--android-skip-build-dependency-validation` flag I tried
        # to add in the previous commit doesn't actually exist in flet-cli
        # 1.1.2 — `flet build apk --help` confirms it. Passing it caused
        # the build to fail immediately with "unrecognized arguments" before
        # any real work happened. Removed.
        # The real fix for the original ReleaseMinSdkCheck failure was
        # bumping min_sdk_version from 21 → 23 in pyproject.toml, which
        # IS in place. Future Flutter/AGP constraint tightenings should
        # be fixed by bumping the offending version in pyproject.toml,
        # not by passing unknown CLI flags.

      - name: Verify APK signature
        run: |
          APK=$(find build -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "APK: $APK"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          "${BUILD_TOOLS}apksigner" verify --print-certs "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: takvps-release-apk
          path: |
            build/flutter/build/app/outputs/apk/release/*.apk
            build/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Debug — show build tree (on failure)
        if: failure()
        run: |
          find build -maxdepth 6 -type d 2>/dev/null | head -40 || true
          find . -name "*.apk" 2>/dev/null || true
