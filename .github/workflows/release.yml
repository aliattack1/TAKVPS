# TAKVPS release builds for Android and Windows.
#
# Triggers:
#   - push of a v* tag (e.g. v0.13.0) → builds + creates a GitHub Release with the artifacts
#   - manual dispatch from the Actions tab → builds + uploads workflow artifacts (no Release)
#
# Flet's `flet build` is the only build step. It:
#   - bundles a CPython distribution + the app's `requirements.txt` into a self-contained binary
#   - on Android: produces an APK (android arm64-v8a is the only abi that ships `cryptography` wheels)
#   - on Windows: produces a one-folder .exe distribution zipped for download
#
# No code signing is configured. Distribute the artifacts out-of-band or wire up signing secrets
# (FLET_KEY_STORE_PATH / FLET_KEY_STORE_PASSWORD on Android, signtool.exe on Windows) before public
# release.
name: Release builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to use for the release (e.g. v0.13.0-test)'
        required: false
        default: ''

permissions:
  contents: write    # required for softprops/action-gh-release to create a Release

jobs:
  # -------------------------------------------------------------------- Android
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet>=0.80"
          pip install -r requirements.txt
          # `flet build apk` needs the build package on Linux hosts
          pip install "flet[apk]"

      - name: Show environment
        run: |
          python --version
          flet --version
          pip freeze | grep -iE "flet|asyncssh|cryptography|httpx"

      - name: Build APK (arm64-v8a)
        run: |
          # arm64-v8a is the only abi that ships prebuilt `cryptography` wheels on the
          # Flet-hosted wheel index (pypi.flet.dev). Building for armeabi-v7a / x86_64
          # would require compiling cryptography from source, which is slow and flaky.
          flet build apk --target-platform android-arm64
        env:
          # Flet's build downloads Python wheels from pypi.flet.dev (its own mirror that
          # hosts Android wheels for native deps like `cryptography`). No auth needed.
          FLET_APP_STORAGE: ${{ runner.temp }}/flet-storage

      - name: Locate built APK
        id: apk
        run: |
          # flet build apk writes to build/apk/<name>-<version>-arm64-v8a.apk
          APK=$(find build/apk -name '*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found in build/apk/"
            ls -la build/apk/ 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: takvps-android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------------------- Windows
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet>=0.80"
          pip install -r requirements.txt

      - name: Show environment
        run: |
          python --version
          flet --version
          pip freeze | findstr /i "flet asyncssh cryptography httpx"

      - name: Build Windows .exe
        run: |
          # `flet build windows` produces a one-folder distribution under build/windows/.
          # We zip it up afterwards so the artifact is a single downloadable file.
          flet build windows
        env:
          FLET_APP_STORAGE: ${{ runner.temp }}/flet-storage

      - name: Locate built .exe folder
        id: win
        shell: bash
        run: |
          # flet build windows writes to build/windows/<product>/
          DIR=$(find build/windows -maxdepth 1 -type d | tail -n 1)
          if [ -z "$DIR" ] || [ "$DIR" = "build/windows" ]; then
            echo "::error::No Windows build dir found in build/windows/"
            ls -la build/windows/ 2>/dev/null || true
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found dir: $DIR"

      - name: Zip the Windows build
        shell: bash
        run: |
          cd build/windows
          DIR_NAME=$(basename "${{ steps.win.outputs.dir }}")
          # Use 7z if available, fall back to tar.
          if command -v 7z >/dev/null 2>&1; then
            7z a -tzip "${DIR_NAME}.zip" "$DIR_NAME"
          else
            tar -a -c -f "${DIR_NAME}.zip" "$DIR_NAME"
          fi
          echo "Created zip: build/windows/${DIR_NAME}.zip"
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: takvps-windows-exe
          path: build/windows/*.zip
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------- Release (tag-only)
  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    # Only create a Release for tag pushes; manual dispatch just leaves the artifacts on the
    # workflow run page (downloadable from the Actions tab for 30 days).
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          find artifacts -type f
          echo "TAG=${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TAKVPS ${{ github.ref_name }}
          generate_release_notes: true
          # Attach every file from every downloaded artifact.
          files: |
            artifacts/takvps-android-apk/*
            artifacts/takvps-windows-exe/*
          body: |
            ## TAKVPS ${{ github.ref_name }}

            Built artifacts for Android (APK, arm64-v8a) and Windows (zipped one-folder .exe).

            ### Install
            - **Android**: transfer the `.apk` to your phone and tap to install. You may need to
              allow "Install from unknown sources" for your file manager.
            - **Windows**: unzip the folder and run the `.exe` inside.

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md)
            for what each phase of the app does. Auto-generated changelog below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
